# nozzle_diameter: 0.4
# filament_diameter: 1.750
# heater_pin: PC8
# ## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
# ## Use "Generic 3950" for NTC 100k 3950 thermistors
# #sensor_type: ATC Semitec 104NT-4-R025H42G                           #Slice Engineering 300 degree thermistor
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PA0
# #control: pid                                                        # Do PID calibration after initial checks
# #pid_Kp: 28.182
# #pid_Ki: 1.978
# #pid_Kd: 100.397
# min_temp: 0
# max_temp: 310
# min_extrude_temp: 170
# max_extrude_only_distance: 150
# max_extrude_cross_section: 50  
# pressure_advance: 0.0                                               # See tuning pressure advance doc
# pressure_advance_smooth_time: 0.040
# max_extrude_cross_section: 5

# [tmc2209 extruder]
# uart_pin: PC11
# tx_pin: PC10
# uart_address: 3
# interpolate: False
# ## For OMC (StepperOnline) 14HR07-1004VRN 1A 0.9°
# #run_current: 0.5   # for OMC 14HR07-1004VRN rated at 1A
# ## For LDO LDO 36STH17-1004AHG 1A 1.8° 
# run_current: 0.65   # for LDO 36STH17-1004AHG
# sense_resistor: 0.110
# stealthchop_threshold: 0                                            # Set to 0 for spreadcycle, avoid using stealthchop on extruder

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC9
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PC3
smooth_time: 3.0
#max_power: 0.6                                                     # Only needed for 100w pads
min_temp: 0
max_temp: 120
#control: pid                                                        # Do PID calibration after initial checks
#pid_kp: 68.453
#pid_ki: 2.749
#pid_kd: 426.122

#####################################################################
#   Fan Control
#####################################################################

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0
# Speed-related options:
max_power: 1.0          # Maximum PWM duty cycle (0.0 – 1.0). Default = 1.0
fan_speed: 0.50          # Speed the fan runs at when active (0.0 – 1.0). Default = 1.0
#off_below: 0.20          # Fan turns completely off below this speed value
kick_start_time: 0.5    # Brief full-speed burst when starting (helps some fans)
#tachometer_pin: ^EBBCan:PB7
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0003   # Important for ~20k RPM fans


[fan]
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.14 

[fan_generic Bed_Fan]
pin: PC6
max_power: 1.0
kick_start_time: 0.5                    # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.04
cycle_time: 0.010



#Chamber
[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: PA0   # TH0 connector on skr
min_temp: 0
max_temp: 100
gcode_id: C



#####################################################################
#   Faster M109 / M190 - avoids long stabilization dwell
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set s = params.S|float %}
    M104 S{s}   ; Set hotend (non-blocking)
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-5} MAXIMUM={s+5}
    {% endif %}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = params.S|float %}
    M140 S{s}   ; Set bed (non-blocking)
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+5}
    {% endif %}


#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
gcode:
  #SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0 # disable the extruder motor
  M18  # disables all stepper motors
  M104 S0 # set hotend to 0C
# A list of G-Code commands to execute on an idle timeout. See
# docs/Command_Templates.md for G-Code format. The default is to run
# "TURN_OFF_HEATERS" and "M84".
timeout: 600

# [safe_z_home]
# home_xy_position: 120,120
# speed: 50.0
# z_hop: 5


#####################################################################
#   Macros
#####################################################################

[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 20,110
screw2_name: back left
screw3: 110,110
screw3_name: back right
# Important settings for pausing
horizontal_move_z: 10      # Height it moves to between screws
probe_height: 0.2          # How low it goes at each screw
speed: 200


[gcode_macro START_PRINT]
description:
  "G-code to run at the start of a print.
  Replace your slicer's start G-code with this.
  Check the README for more details on usage.
  @param {int} [HOTEND=200] - The target hotend temp
  @param {int} [BED=60] - The target bed temp
  #@param {bool} [RELATIVE_E_MODE=false] - Whether the extruder should be in relative mode

gcode:
    {% set hotend_temp  = params.EXTRUDER_TEMP|default(params.EXTRUDER)|default(params.HOTEND)|default(200)|int %}
    {% set bed_temp     = params.BED_TEMP|default(params.BED)|default(60)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(params.CHAMBER)|default(0)|int %}

    M104 S{hotend_temp}
    M140 S{bed_temp}

    # Conditional homing: home only if not already fully homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90                          ; Absolute positioning

    # === Bed Heating ===

    M190 S{bed_temp}

    # === Hotend Heating ===

    M109 S{hotend_temp}

    # === Chamber Heating + Wait ===
    {% if chamber_temp > 0 %}
        M141 S{chamber_temp}           ; Set chamber target temperature
        M191 S{chamber_temp}           ; Wait until chamber reaches target temp
        M117 Chamber ready: {chamber_temp} C
    {% endif %}

    LINE_PURGE                     ; KAMP dynamic line purge


[neopixel hotend_rgb]
