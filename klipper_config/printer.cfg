[gcode_macro END_PRINT]
gcode:
    M400                        ; clear buffer
    M104 S0                     ; turn off temperature
    M140 S0                     ; turn off heatbed
    M107                        ; turn off fan
    G91                         ; relative positioning
    #G1 Z5                       ; move Z down 5mm
    G28Z                        ; Bring Z down to home
    G90                         ; absolute positioning
    G1 F1000.0                  ; set feed rate
    G1 E-3                      ; retract
    G1 X118 Y118 Z118 F3000          ; home X axis
    M221 S100                   ; Reset Filament Flowrate
    M84 XYE                      ; disable motors

    
[gcode_macro LEVEL_BED]
description: Full manual bed leveling (heats bed first)
gcode:
    G28                            ; Home all
    G90                            ; Absolute positioning
    
    M117 Heating bed...
    M140 S70                       ; Set bed temp (change as needed)
    M190 S70                       ; Wait for bed temperature
    
    M117 Starting leveling...
    BED_SCREWS_ADJUST
    
    G0 Z15 F3000                   ; Raise nozzle
    G0 X60 Y120 F6000              ; Park at back
    M117 Leveling complete
    TURN_OFF_HEATERS

[gcode_macro LEVEL_BED_QUICK]
description: Quick manual bed check (no heating)
gcode:
    G28                            ; Home all
    G90                            ; Absolute positioning
    
    M117 Quick bed check...
    BED_SCREWS_ADJUST
    
    G0 Z15 F3000                   ; Raise nozzle
    G0 X60 Y120 F6000              ; Park
    M117 Quick check complete

    
[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E30 F300                    ; load
   G1 E15 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E10 F300                    ; extrude a little to soften tip
   G1 E-40 F1800                  ; retract some, but not too much or it will jam
   M82                            ; set extruder to absolute

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
[pause_resume]
[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  {% set E = params.E|default(1.7)|float %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  SAVE_GCODE_STATE NAME=PAUSE_state
  BASE_PAUSE
  G91
  G1 E-{E} F2100
  G1 Z{z_safe} F900
  G90
  G0 X{x_park} Y{y_park} F6000
  G91

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(1)|float %} # edit to your preferred retract length
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

