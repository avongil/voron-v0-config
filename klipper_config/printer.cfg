[gcode_macro LED50]
gcode:
  SET_LED LED=board_rgb RED=0.5 GREEN=0.5 BLUE=0.5 [INDEX=8] [TRANSMIT=0]

[gcode_macro LED75]
gcode:
  SET_LED LED=board_rgb RED=0.75 GREEN=0.75 BLUE=0.75 [INDEX=8] [TRANSMIT=0]

[gcode_macro LED100]
gcode:
  SET_LED LED=board_rgb RED=1 GREEN=1 BLUE=1 [INDEX=8] [TRANSMIT=0]

[gcode_macro LED0]
gcode:
  SET_LED LED=board_rgb RED=0 GREEN=0 BLUE=0 [INDEX=8] [TRANSMIT=0]

[gcode_macro heating_led]
gcode:
  SET_LED LED=board_rgb RED=1 GREEN=0 BLUE=0 [INDEX=8] [TRANSMIT=0]

[gcode_macro cooling_led]
gcode:
  SET_LED LED=board_rgb RED=0.0 GREEN=0.5 BLUE=1 [INDEX=8] [TRANSMIT=0]


[gcode_macro PartyTime]
gcode:
    {% for flashes in range(params.COUNT|default(10)|int) %}
        {% set n = flashes % 3 %}
        {% if n == 0 %}
            SET_LED LED=hotend_rgb RED=1 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=0 GREEN=1 BLUE=0 INDEX=2 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=1 INDEX=3 TRANSMIT=1
        {% elif n == 1 %}
            SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=1 INDEX=1 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=0 GREEN=1 BLUE=0 INDEX=3 TRANSMIT=1
        {% else %}
            SET_LED LED=hotend_rgb RED=0 GREEN=1 BLUE=0 INDEX=1 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=1 INDEX=2 TRANSMIT=0
            SET_LED LED=hotend_rgb RED=1 GREEN=0 BLUE=0 INDEX=3 TRANSMIT=1
        {% endif %}
	SET_LED LED=board_rgb RED=0.5 GREEN=0.0 BLUE=0.0 INDEX=3 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=16 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=1 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=15 TRANSMIT=0
