        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=14 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=9 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=13 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=10 TRANSMIT=1
	G4 P250                       ; sleep 250ms
	SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=3 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=7 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=1 INDEX=4 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=1 INDEX=8 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=5 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=9 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=6 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=10 TRANSMIT=1
	G4 P250                       ; sleep 250ms
        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=3 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=7 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=4 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=8 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=1 INDEX=5 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=1 BLUE=0.0 INDEX=9 TRANSMIT=0
