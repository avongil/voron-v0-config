press_gcode:
    M112
############# Emergency Stop END #####################



[gcode_macro T0]
gcode:
    # single extruder, nothing to select
[gcode_macro T1]
gcode:
    # single extruder, nothing to select
[gcode_macro T2]
gcode:
    # single extruder, nothing to select
[gcode_macro T3]
gcode:
    # single extruder, nothing to select

[gcode_macro M141]
gcode:
    # no chamber heater installed, ignore chamber temp target

[gcode_macro M191]
gcode:
    # no chamber heater installed, ignore chamber temp wait



#####################################################################
#   Faster M109 / M190 - avoids long stabilization dwell
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set s = params.S|float %}
    M104 S{s}   ; Set hotend (non-blocking)
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-5} MAXIMUM={s+5}
    {% endif %}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = params.S|float %}
    M140 S{s}   ; Set bed (non-blocking)
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+5}
    {% endif %}


#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
gcode:
  #SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0 # disable the extruder motor
  M18  # disables all stepper motors
  M104 S0 # set hotend to 0C
  STATUS_READY
# A list of G-Code commands to execute on an idle timeout. See
# docs/Command_Templates.md for G-Code format. The default is to run
# "TURN_OFF_HEATERS" and "M84".
timeout: 600

# [safe_z_home]
# home_xy_position: 120,120
# speed: 50.0
# z_hop: 5


#####################################################################
#   Macros
#####################################################################

[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 20,110
screw2_name: back left
screw3: 110,110
screw3_name: back right
# Important settings for pausing
horizontal_move_z: 10      # Height it moves to between screws
probe_height: 0.2          # How low it goes at each screw
speed: 200

#####################################################################
#   Purge Line (replaces KAMP's LINE_PURGE)
#####################################################################
# Draws a simple prime/purge line along the front edge of the bed,
# between X40 and X80 at Y0 (front-center of the 120x120 bed).
# Adapted from the well-known Voron V0.1 purge line macro.
#
# Two ways this gets skipped automatically:
#   1. Manual toggle - run PURGE_LINE_ENABLE ENABLE=0 to disable, ENABLE=1
#      to re-enable. Persists until you change it again.
#   2. Auto-detect - if the sliced object geometry (from [exclude_object],
#      which your slicer must send EXCLUDE_OBJECT_DEFINE commands for
#      before START_PRINT runs) overlaps the purge line's footprint
#      (X 35-85, Y 0-2), the purge is skipped so it doesn't dig into
#      a part placed near the front edge of the bed.
# Either way, PURGE_LINE just no-ops and prints a RESPOND explaining why -
# it never throws an error that would stop the print.

[gcode_macro _PURGE_LINE_STATE]
variable_enabled: 1
gcode:
    # state holder only, never called directly

[gcode_macro PURGE_LINE_ENABLE]
description: "PURGE_LINE_ENABLE ENABLE=0 to disable the auto purge line, ENABLE=1 to re-enable"
gcode:
    {% set enable = params.ENABLE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_PURGE_LINE_STATE VARIABLE=enabled VALUE={enable}
    RESPOND MSG="Purge line: {'enabled' if enable else 'disabled'}"

[gcode_macro PURGE_LINE]
gcode:
    {% set manually_enabled = printer["gcode_macro _PURGE_LINE_STATE"].enabled %}
    {% set ns = namespace(blocked=false) %}
    {% for obj in printer.exclude_object.objects %}
        {% for point in obj.polygon %}
            {% if point[1] <= 2.0 and point[0] >= 35 and point[0] <= 85 %}
                {% set ns.blocked = true %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% if not manually_enabled %}
        RESPOND MSG="Purge line: skipped (disabled via PURGE_LINE_ENABLE)"
    {% elif ns.blocked %}
        RESPOND MSG="Purge line: skipped (a part's geometry overlaps the purge area)"
    {% else %}
        G90                             ; absolute positioning
        G0 X0 Y0 F6000                 ; go to front of print bed
        G1 Z0.4 F500.0                  ; move nozzle down close to bed
        G92 E0.0 ; reset extrusion distance
        G1 X0.0 Y0 F6000.0 ; go outside print area
        G1 E6 F500 ; de-retract and push ooze
        G1 X15.0 Z.2 E6 F500.0 ; fat 10mm intro line @ 0.40 Tamp to .2
        G1 X30.0 E3.2  F500.0 ; thin +30mm intro line @ 0.2
        G1 X45.0 Z.4 E8  F500.0 ; fat +30mm intro line @ .2 ramp to 0.4
        G1 E-0.8 F3000; retract to avoid stringing
        G92 E0.0 ; reset extrusion distance
    {% endif %}


[gcode_macro START_PRINT]
description:
  "G-code to run at the start of a print.
  Replace your slicer's start G-code with this.
  Check the README for more details on usage.
  @param {int} [HOTEND=200] - The target hotend temp
  @param {int} [BED=60] - The target bed temp
  #@param {bool} [RELATIVE_E_MODE=false] - Whether the extruder should be in relative mode

gcode:
    {% set hotend_temp  = params.EXTRUDER_TEMP|default(params.EXTRUDER)|default(params.HOTEND)|default(200)|int %}
    {% set bed_temp     = params.BED_TEMP|default(params.BED)|default(60)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(params.CHAMBER)|default(0)|int %}

    M104 S{hotend_temp}
    M140 S{bed_temp}

    # Conditional homing: home only if not already fully homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}
    G90                          ; Absolute positioning

    # === Bed Heating ===

    STATUS_HEATING
    M190 S{bed_temp}

    # === Hotend Heating ===

    M109 S{hotend_temp}

    # === Chamber Heating + Wait ===
    {% if chamber_temp > 0 %}
        M141 S{chamber_temp}           ; Set chamber target temperature
        M191 S{chamber_temp}           ; Wait until chamber reaches target temp
        M117 Chamber ready: {chamber_temp} C
    {% endif %}

    STATUS_BUSY                    ; purging
    PURGE_LINE                     ; simple front-of-bed purge line
    STATUS_PRINTING


[neopixel board_rgb]
pin: PA8
chain_count: 16
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
# Extended Macros for case LEDs

#####################################################################
#   Hotend / Toolhead Status LEDs (StealthBurner-style)
#####################################################################
# Which LED style is on the toolhead right now is picked by which of these
# two includes is active. To switch: comment out one, uncomment the other,
# then FIRMWARE_RESTART. Each file defines [neopixel hotend_rgb] and
# [gcode_macro _hotend_led_vars] (colors + chain wiring) for that LED
# style -- nothing else below needs to change when you swap LEDs.
[include leds-hotend-generic.cfg]
#[include leds-hotend-namebrand.cfg]
# NOTHING happens automatically just by defining these - each STATUS_*
# macro below is called from START_PRINT/END_PRINT/PAUSE/RESUME/etc.

[gcode_macro _set_hotend_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}

    {% for led_index in idx %}
        {% set transmit = transmit_last if loop.last else 0 %}
        SET_LED LED={led} RED={red} GREEN={green} BLUE={blue} INDEX={led_index} TRANSMIT={transmit}
    {% endfor %}

[gcode_macro _set_hotend_leds_by_name]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _hotend_led_vars"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _hotend_led_vars"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _hotend_led_vars"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    _set_hotend_leds led={led} red={color.r} green={color.g} blue={color.b} idx="{idx}" transmit={transmit}

[gcode_macro STATUS_OFF]
description: All toolhead LEDs off (e.g. on shutdown)
gcode:
    _set_hotend_leds_by_name leds="logo" color="off" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="off"

[gcode_macro STATUS_READY]
description: Dim idle/standby glow
gcode:
    _set_hotend_leds_by_name leds="logo" color="standby" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="standby"

[gcode_macro STATUS_HOMING]
gcode:
    _set_hotend_leds_by_name leds="logo" color="homing" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="on"

[gcode_macro STATUS_LEVELING]
gcode:
    _set_hotend_leds_by_name leds="logo" color="leveling" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="on"

[gcode_macro STATUS_HEATING]
gcode:
    _set_hotend_leds_by_name leds="logo" color="heating" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="heating"

[gcode_macro STATUS_BUSY]
description: Generic "working, please wait" state (e.g. purge line)
gcode:
    _set_hotend_leds_by_name leds="logo" color="busy" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="on"

[gcode_macro STATUS_PRINTING]
gcode:
    _set_hotend_leds_by_name leds="logo" color="printing" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="printing"

[gcode_macro STATUS_PAUSED]
gcode:
    _set_hotend_leds_by_name leds="logo" color="paused" transmit=0
    _set_hotend_leds_by_name leds="nozzle" color="paused"


[delayed_gcode Welcome_0]
initial_duration: 0
gcode:
  SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=0.0

[delayed_gcode Hotend_LED_Ready]
# hotend_rgb lives on the EBBCan CAN toolboard, which needs a couple
# seconds to finish connecting after Klipper starts. Calling STATUS_READY
# at initial_duration:0 (like Welcome_0 does for the local board_rgb chain)
# fires before that CAN link is up, so the command silently gets dropped
# and the LEDs just sit at their raw initial_RED/GREEN/BLUE value. Waiting
# a couple seconds here gives the toolboard time to sync first.
initial_duration: 3
gcode:
  STATUS_READY

[delayed_gcode Welcome_1]
initial_duration: 0.5
gcode:
  SET_LED LED=board_rgb RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
  SET_LED LED=board_rgb RED=1 GREEN=1 BLUE=1 INDEX=16 TRANSMIT=1

[delayed_gcode Welcome_2]
