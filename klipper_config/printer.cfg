        SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1 INDEX=10 TRANSMIT=1
	G4 P250                       ; sleep 250ms
    {% endfor %}
	SET_LED LED=board_rgb RED=0.3 GREEN=0.3 BLUE=0.3
	STATUS_READY                  ; restore normal toolhead LED state



[gcode_macro END_PRINT]
gcode:
    M400                        ; clear buffer
    M104 S0                     ; turn off temperature
    M140 S0                     ; turn off heatbed
    M107                        ; turn off fan
    G91                         ; relative positioning
    #G1 Z5                       ; move Z down 5mm
    G28Z                        ; Bring Z down to home
    G90                         ; absolute positioning
    G1 F1000.0                  ; set feed rate
    G1 E-3                      ; retract
    G1 X118 Y118 Z118 F3000          ; home X axis
    M221 S100                   ; Reset Filament Flowrate
    M84 XYE                      ; disable motors
    STATUS_READY


[gcode_macro LEVEL_BED]
description: Full manual bed leveling (heats bed first)
gcode:
    STATUS_HOMING
    G28                            ; Home all
    G90                            ; Absolute positioning

    M117 Heating bed...
    STATUS_HEATING
    M140 S70                       ; Set bed temp (change as needed)
    M190 S70                       ; Wait for bed temperature

    M117 Starting leveling...
    STATUS_LEVELING
    BED_SCREWS_ADJUST

    G0 Z15 F3000                   ; Raise nozzle
    G0 X60 Y120 F6000              ; Park at back
    M117 Leveling complete
    TURN_OFF_HEATERS
    STATUS_READY

[gcode_macro LEVEL_BED_QUICK]
description: Quick manual bed check (no heating)
gcode:
    STATUS_HOMING
    G28                            ; Home all
    G90                            ; Absolute positioning

    M117 Quick bed check...
    STATUS_LEVELING
    BED_SCREWS_ADJUST

    G0 Z15 F3000                   ; Raise nozzle
    G0 X60 Y120 F6000              ; Park
    M117 Quick check complete
    STATUS_READY


[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E30 F300                    ; load
   G1 E15 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute

[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E10 F300                    ; extrude a little to soften tip
   G1 E-40 F1800                  ; retract some, but not too much or it will jam
   M82                            ; set extruder to absolute

#####################################################################
#   CANCEL_PRINT - raise Z 50mm, or home Z if that would over-travel
#####################################################################
# Z is a tight axis on this machine: position_max is only ~1mm above
# the homed position (127 vs a 126 endstop position), so a blind
# relative Z+50 can easily exceed position_max and throw a "Move out
# of range" error that aborts the rest of the cancel sequence. This
# checks the current Z position against axis_maximum first: if there's
# room for the full 50mm, it raises normally; if not, it homes Z
# instead so the toolhead still ends up safely out of the way.

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    STATUS_READY
    CANCEL_PRINT_BASE
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if current_z + 50 <= max_z %}
        G91                          ; relative positioning
        G1 Z50 F600                  ; raise Z 50mm
        G90                          ; absolute positioning
    {% else %}
        G28 Z                       ; not enough headroom, home Z instead
    {% endif %}
    M84                          ; disable all steppers
[pause_resume]
[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  {% set E = params.E|default(1.7)|float %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  SAVE_GCODE_STATE NAME=PAUSE_state
  BASE_PAUSE
  STATUS_PAUSED
  G91
  G1 E-{E} F2100
  G1 Z{z_safe} F900
  G90
  G0 X{x_park} Y{y_park} F6000
  G91

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(1)|float %} # edit to your preferred retract length
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
    STATUS_PRINTING

[gcode_macro _BED_FAN_STATE]
variable_last_speed: -1
variable_min_speed: 0.05
variable_max_speed: 1.0 #15% with fans pointing up is the max.
variable_ramp_start_temp: 80.0
variable_max_chamber_temp: 55.0
variable_announce: 0 # Run BED_FAN_VERBOSE ENABLE=0 any time you want it quiet, BED_FAN_VERBOSE ENABLE=1 to bring it back. Default is on (variable_announce: 1), so nothing changes until you actually flip it.
gcode:
    # state holder only, never called directly

[delayed_gcode BED_FAN_RAMP]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _BED_FAN_STATE"] %}
    {% set bed = printer.heater_bed %}
    {% set target = bed.target %}
    {% set current = bed.temperature %}
    {% set chamber = printer["temperature_sensor Chamber"].temperature %}
    {% set last_speed = state.last_speed %}
    {% set min_speed = state.min_speed %}
    {% set max_speed = state.max_speed %}
    {% set start_temp = state.ramp_start_temp %}
    {% set max_chamber = state.max_chamber_temp %}
    {% set announce = state.announce %}
    {% if target > start_temp and chamber < max_chamber %}
        {% set span = target - start_temp %}
        {% set frac = ((current - start_temp) / span) if span > 0 else 1.0 %}
        {% set frac = [[frac, 0.0]|max, 1.0]|min %}
        {% set speed = (min_speed + frac * (max_speed - min_speed))|round(3) %}
        {% if speed != last_speed %}
            {% if announce %}
                RESPOND MSG="Bed_Fan: {(speed*100)|round(0)|int}% @ {current|round(1)}C (target {target|round(1)}C, chamber {chamber|round(1)}C)"
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_BED_FAN_STATE VARIABLE=last_speed VALUE={speed}
        {% endif %}
        SET_FAN_SPEED FAN=Bed_Fan SPEED={speed}
        UPDATE_DELAYED_GCODE ID=BED_FAN_RAMP DURATION=3
    {% elif target > start_temp and chamber >= max_chamber %}
        {% if last_speed != 0 %}
            {% if announce %}
                RESPOND MSG="Bed_Fan: off, chamber {chamber|round(1)}C >= {max_chamber|round(1)}C"
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_BED_FAN_STATE VARIABLE=last_speed VALUE=0
        {% endif %}
        SET_FAN_SPEED FAN=Bed_Fan SPEED=0
        UPDATE_DELAYED_GCODE ID=BED_FAN_RAMP DURATION=3
    {% else %}
        {% if last_speed != 0 %}
            {% if announce %}
                RESPOND MSG="Bed_Fan: off @ {current|round(1)}C"
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_BED_FAN_STATE VARIABLE=last_speed VALUE=0
        {% endif %}
        SET_FAN_SPEED FAN=Bed_Fan SPEED=0
    {% endif %}

[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set s = params.S|default(0)|float %}
    {% set start_temp = printer["gcode_macro _BED_FAN_STATE"].ramp_start_temp %}
    M140.1 S{s}
    {% if s > start_temp %}
        UPDATE_DELAYED_GCODE ID=BED_FAN_RAMP DURATION=1
    {% else %}
        SET_FAN_SPEED FAN=Bed_Fan SPEED=0
    {% endif %}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default("") %}
    {% set target = params.TARGET|default(0)|float %}
    {% set start_temp = printer["gcode_macro _BED_FAN_STATE"].ramp_start_temp %}
    SET_HEATER_TEMPERATURE_BASE HEATER={heater} TARGET={target}
    {% if heater == "heater_bed" %}
        {% if target > start_temp %}
            UPDATE_DELAYED_GCODE ID=BED_FAN_RAMP DURATION=1
        {% else %}
            SET_FAN_SPEED FAN=Bed_Fan SPEED=0
        {% endif %}
    {% endif %}

[gcode_macro BED_FAN_VERBOSE]
gcode:
    {% set enable = params.ENABLE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_BED_FAN_STATE VARIABLE=announce VALUE={enable}
    RESPOND MSG="Bed_Fan announcements: {'on' if enable else 'off'}"

