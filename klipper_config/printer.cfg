check_gain_time: 40
hysteresis: 5
heating_gain: 2



#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC9
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PC3
smooth_time: 3.0
#max_power: 0.6                                                     # Only needed for 100w pads
min_temp: 0
max_temp: 120
#control: pid                                                        # Do PID calibration after initial checks
#pid_kp: 68.453
#pid_ki: 2.749
#pid_kd: 426.122

#####################################################################
#   Fan Control
#####################################################################

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0

# 1. UNLEASH MAXIMUM COOLING (Fixes Heat Creep)
max_power: 1.0
fan_speed: 1.0           # Changed from .700 to 1.0 to give the fan full 24V power

# 2. STABILIZE 2-WIRE COMMUTATION (Fixes Surging)
cycle_time: 0.010        # Drops frequency to 100Hz. Crucial for a 2-wire setup on EBB36.
hardware_pwm: False

# 3. CONTROL STARTUP SURGES
kick_start_time: 0.100   # Dropped from 1.0 to prevent severe voltage spikes on boot



[fan]
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.14

[fan_generic Bed_Fan]
pin: PC6
max_power: 1.0
kick_start_time: .05                    # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.04
cycle_time: 0.010



#Chamber
[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: PA0   # TH0 connector on skr
min_temp: 0
max_temp: 100
gcode_id: C

############# Emergency Stop #####################
#orange led - one when klipper is running off when in e-stop or klipper has shut down.
[output_pin estop_led]
pin: PC7
value: 1
shutdown_value: 0

# the estop switch
[gcode_button estop_button]
