        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=1 INDEX=3 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=1 INDEX=13 TRANSMIT=0
        SET_LED LED=board_rgb RED=0.0 GREEN=1 BLUE=0.0 INDEX=4 TRANSMIT=0
        SET_LED LED=board_rgb RED=1 GREEN=0.0 BLUE=0.0 INDEX=12 TRANSMIT=0
