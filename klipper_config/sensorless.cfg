#####################################################################
#   Sensorless homing (TMC2209 StallGuard4) -- tuned for use WITH
#   klipper_tmc_autotune.
#
#   Why this file sets things autotune also touches:
#   - Autotune writes its own SGTHRS (DUMP_TMC showed sgthrs=40) and
#     silently overrides driver_SGTHRS in [tmc2209 ...]. So the homing
#     threshold is now set HERE, right before each homing move, where
#     nothing can override it. Tune the two values in _HOMING_VARS.
#   - Autotune enables CoolStep (semin=2, seimin=1). During a homing
#     move Klipper opens TCOOLTHRS fully, so CoolStep was free to cut
#     homing current down to ~1/4 of 0.85A when load was light, which
#     collapses SG_RESULT and reads as a stall -> random false triggers.
#     CoolStep is switched off (semin=0) for the homing move and put
#     back afterwards.
#
#   Tuning SGTHRS (2209: higher = MORE sensitive, stall when
#   SG_RESULT <= 2*SGTHRS):
#     1. Edit sgthrs_x below, RESTART, run G28 X several times.
#     2. Triggers before the end -> lower it. Grinds/bangs at the
#        end -> raise it. Find both edges, pick the middle.
#     3. Repeat for Y with sgthrs_y.
#####################################################################

[gcode_macro _HOMING_VARS]
# Starting points only -- with CoolStep off, SG_RESULT reads higher
# than it did with autotune's 40, so expect to tune these.
variable_sgthrs_x: 80
variable_sgthrs_y: 80
# Homing current and accel for the A/B motors during sensorless homing
variable_home_current: 0.85
variable_home_accel: 1000
# CoolStep minimum to restore after homing -- matches what autotune
# set (COOLCONF semin=2 in DUMP_TMC). Update if autotune changes it.
variable_semin_restore: 2
gcode:

[gcode_macro _SENSORLESS_BEGIN]
gcode:
    {% set v = printer["gcode_macro _HOMING_VARS"] %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={v.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={v.home_current}
    # CoolStep off for the homing move (see header)
    SET_TMC_FIELD STEPPER=stepper_x FIELD=semin VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=semin VALUE=0
    # Homing threshold, applied here so autotune can't override it
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sgthrs VALUE={v.sgthrs_x}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sgthrs VALUE={v.sgthrs_y}
    # Let StallGuard / StealthChop settle from any prior motion
    G4 P2000
    # [printer] max_accel (10000) is too aggressive for a homing move:
    # the current spike on the initial ramp can false-trigger StallGuard.
    SET_VELOCITY_LIMIT ACCEL={v.home_accel}

[gcode_macro _SENSORLESS_END]
gcode:
    {% set v = printer["gcode_macro _HOMING_VARS"] %}
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set MAX_ACCEL = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT ACCEL={MAX_ACCEL}
    # Give StallGuard registers time to clear
    G4 P500
    # CoolStep back on, run current back for printing
    SET_TMC_FIELD STEPPER=stepper_x FIELD=semin VALUE={v.semin_restore}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=semin VALUE={v.semin_restore}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_X]
gcode:
    SAVE_GCODE_STATE NAME=STATE_HOME_X
    _SENSORLESS_BEGIN
    G28 X
    # Move away
    G91
    G1 X-5 F1200
    _SENSORLESS_END
    RESTORE_GCODE_STATE NAME=STATE_HOME_X

[gcode_macro _HOME_Y]
gcode:
    SAVE_GCODE_STATE NAME=STATE_HOME_Y
    _SENSORLESS_BEGIN
    G28 Y
    # Move away
    G91
    G1 Y-5 F1200
    _SENSORLESS_END
    RESTORE_GCODE_STATE NAME=STATE_HOME_Y

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    SAVE_GCODE_STATE NAME=STATE_HOME_OVERRIDE

    # Home Z first, to avoid any situation where the nozzle might scrape the bed
    # (no dwell needed here - Z uses a physical endstop, not StallGuard)
    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}

    G90

    # Move to bed center only if homing all axes or explicitly commanded for X and Y axes
    {% if home_all or ('X' in params and 'Y' in params) %}
      G0 X60 Y60 Z20 F3600 # move to bed center
    {% endif %}
    RESTORE_GCODE_STATE NAME=STATE_HOME_OVERRIDE
