#####################################################################
#   Toolhead LEDs -- GENERIC / CHEAP (Amazon-style SK6812/WS2812 clones)
#####################################################################
# Include this file (and comment out leds-hotend-namebrand.cfg in
# printer.cfg) when the hotend/toolhead LED chain currently installed is
# the cheap generic strip. See leds-hotend-namebrand.cfg for the values
# that matched the original name-brand LEDs -- swap back to that file if
# you ever put those back on.

[neopixel hotend_rgb]
# CONFIRMED 2026-08: this strip is actually a 4-channel RGBW part (an extra
# white die per LED), not the 3-channel RGB the original name-brand SK6812
# was. It was wired/driven as if 3-channel (color_order: GRB, 3 bytes/LED)
# while the chip expects 4 bytes/LED -- so every LED after the first was
# reading a byte stream shifted by one slot, and the missing/undefined 4th
# byte showed up as a stray white LED in the chain. Fixing color_order to
# a 4-channel order (GRBW, the standard byte order for SK6812RGBW-style
# clones) sends the correct 4 bytes/LED, including an explicit WHITE=0 on
# every SET_LED call (see _hotend_led_vars / _set_hotend_leds below, none
# of which pass WHITE, so it defaults to 0.0 every time). If colors still
# look shifted/wrong after this change, the byte ORDER within the 4 may be
# different on this clone -- try color_order: RGBW (or another permutation)
# instead of GRBW.
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _hotend_led_vars]
# Tuned 2026-08 for the cheap generic LEDs -- roughly 4x dimmer than the
# name-brand values, and mixed hues (homing/heating/printing) lean less on
# GREEN than a straight scale-down would, since green-containing colors
# were the ones blowing out to white. This is a starting point, not a
# lab-measured answer -- nudge individual r/g/b numbers and issue
# STATUS_READY / STATUS_HEATING / etc. from the console to preview a
# state without starting a print.
variable_colors: {
        'logo': {
            'off':      {'r': 0.0,   'g': 0.0,   'b': 0.0},
            'standby':  {'r': 0.0,   'g': 0.15,  'b': 0.0},
            'homing':   {'r': 0.0,   'g': 0.12,  'b': 0.18},
            'leveling': {'r': 0.15,  'g': 0.15,  'b': 0.15},
            'heating':  {'r': 0.22,  'g': 0.16,  'b': 0.0},
            'busy':     {'r': 0.25,  'g': 0.0,   'b': 0.0},
            'printing': {'r': 0.34,  'g': 0.20,  'b': 0.0},
            'paused':   {'r': 0.18,  'g': 0.0,   'b': 0.18},
        },
        'nozzle': {
            'off':      {'r': 0.0,   'g': 0.0,   'b': 0.0},
            'standby':  {'r': 0.15,  'g': 0.15,  'b': 0.15},
            'on':       {'r': 0.18,  'g': 0.18,  'b': 0.18},
            'heating':  {'r': 0.22,  'g': 0.16,  'b': 0.0},
            'printing': {'r': 0.18,  'g': 0.18,  'b': 0.18},
            'paused':   {'r': 0.18,  'g': 0.0,   'b': 0.18},
        },
    }
# hotend_rgb chain order confirmed by direct testing (this is physical
# wiring, so it stays the same regardless of which LED style is active):
#   index 1 = right nozzle LED
#   index 2 = left nozzle LED
#   index 3 = top/logo LED
variable_logo_led_name:   "hotend_rgb"
variable_logo_idx:        "1"
variable_nozzle_led_name: "hotend_rgb"
variable_nozzle_idx:      "2,3"
gcode:
    # required, do not delete
