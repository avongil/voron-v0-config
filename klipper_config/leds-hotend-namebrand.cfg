#####################################################################
#   Toolhead LEDs -- ORIGINAL NAME-BRAND (quality SK6812)
#####################################################################
# Include this file (and comment out leds-hotend-generic.cfg in
# printer.cfg) when the hotend/toolhead LED chain currently installed is
# the original name-brand SK6812 strip. See leds-hotend-generic.cfg for
# the dimmed values used with the cheap Amazon LEDs -- swap to that file
# if you put cheap LEDs back on.

[neopixel hotend_rgb]
# Confirmed 3-channel RGB (not RGBW) SK6812 - color_order: GRB is correct.
# Daisy-chain order (index 1 -> 3): right nozzle LED, left nozzle LED,
# top/logo LED. Test colors below (R=1,G=0,B=1 = magenta) should render
# as the SAME magenta on all three LEDs after a restart. If any LED shows
# a different color, the chain order assumption above is wrong for that
# LED's position.
pin: EBBCan:PD3
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[gcode_macro _hotend_led_vars]
variable_colors: {
        'logo': {
            'off':      {'r': 0.0,  'g': 0.0,  'b': 0.0},
            'standby':  {'r': 0.0,  'g': 0.7,  'b': 0.0},
            'homing':   {'r': 0.0,  'g': 0.7,  'b': 0.7},
            'leveling': {'r': 0.7,  'g': 0.7,  'b': 0.7},
            'heating':  {'r': 0.7,  'g': 0.7,  'b': 0.0},
            'busy':     {'r': 0.7,  'g': 0.0,  'b': 0.0},
            'printing': {'r': 1.0,  'g': 0.7,  'b': 0.0},
            'paused':   {'r': 0.7,  'g': 0.0,  'b': 0.7},
        },
        'nozzle': {
            'off':      {'r': 0.0,  'g': 0.0,  'b': 0.0},
            'standby':  {'r': 0.7,  'g': 0.7,  'b': 0.7},
            'on':       {'r': 0.8,  'g': 0.8,  'b': 0.8},
            'heating':  {'r': 0.7,  'g': 0.7,  'b': 0.0},
            'printing': {'r': 0.8,  'g': 0.8,  'b': 0.8},
            'paused':   {'r': 0.7,  'g': 0.0,  'b': 0.7},
        },
    }
# hotend_rgb chain order confirmed by direct testing (this is physical
# wiring, so it stays the same regardless of which LED style is active):
#   index 1 = right nozzle LED
#   index 2 = left nozzle LED
#   index 3 = top/logo LED
variable_logo_led_name:   "hotend_rgb"
variable_logo_idx:        "3"
variable_nozzle_led_name: "hotend_rgb"
variable_nozzle_idx:      "1,2"
gcode:
    # required, do not delete
